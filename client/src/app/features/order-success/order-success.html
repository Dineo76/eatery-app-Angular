<div class="success-container">
    <mat-card class="success-card">
      <div class="icon-header">
        <div class="check-circle">
          <mat-icon class="check-icon">check_circle</mat-icon>
        </div>
        <h2>Order Placed Successfully!</h2>
        <p class="sub-heading">Thank you for your order. We are preparing your kota now.</p>
      </div>
  
      <mat-divider></mat-divider>
  
      <div class="order-details">
        <div class="detail-row">
          <span class="detail-label">Order Number</span>
          <span class="detail-value order-id">#{{ orderId }}</span>
        </div>
  
        <div class="detail-row">
          <span class="detail-label">Estimated Delivery Time</span>
          <span class="detail-value highlight">{{ estimatedTime }}</span>
        </div>
  
        <div class="detail-row">
          <span class="detail-label">Status</span>
          <span class="status-badge">Preparing</span>
        </div>
      </div>
  
      <mat-divider></mat-divider>
  
      <div class="card-actions">
        <button mat-flat-button class="primary-btn" (click)="goToHome()">
          Back to Menu
        </button>
      </div>
    </mat-card>
  </div>
