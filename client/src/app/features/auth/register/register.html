  <div class="auth-container">
  <h2>Create an Account</h2>

  @if (errorMessage) {
    <p class="error-text" style="color: red; margin-bottom: 1rem;">{{ errorMessage }}</p>
  }

  <form (ngSubmit)="onSubmit()" autocomplete="off">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Full Name</mat-label>
      <input matInput type="text" name="fullName" autocomplete="off" [(ngModel)]="fullName" required />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email Address</mat-label>
      <input matInput type="email" name="email" autocomplete="off" [(ngModel)]="email" required />
    </mat-form-field>

    <!-- PASSWORD INPUT WITH ANGULAR MATERIAL EYE TOGGLE -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Password</mat-label>
      <input 
        matInput 
        [type]="hidePassword ? 'password' : 'text'" 
        name="password" 
        autocomplete="new-password"
        [(ngModel)]="password" 
        required 
      />
      
      <!-- matSuffix places the button inside the input field on the right -->
      <button 
        mat-icon-button 
        matSuffix 
        type="button" 
        (click)="hidePassword = !hidePassword" 
        [attr.aria-label]="'Hide password'" 
        [attr.aria-pressed]="hidePassword">
        <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </mat-form-field>

    <button mat-raised-button type="submit" class="full-width register-btn">
      Register
    </button>
  </form>

  <div class="auth-links">
    <p>Already have an account? <a routerLink="/signin">Sign In</a></p>
  </div>
</div>
