<div class="auth-container">
    <h2>Reset Password</h2>
  
    @if (!messageSent) {
      <p class="subtitle">Enter your account email to receive a password reset link.</p>
      
      <form (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email Address</mat-label>
          <input matInput type="email" name="email" [(ngModel)]="email" required />
        </mat-form-field>
  
        <button mat-raised-button color="primary" type="submit" class="full-width">
          Send Reset Link
        </button>
      </form>
    } @else {
      <div class="success-message">
        <p>A password reset link has been sent to <strong>{{ email }}</strong>.</p>
      </div>
    }
  
    <div class="auth-links">
      <a routerLink="/signin">Back to Sign In</a>
    </div>
  </div>
