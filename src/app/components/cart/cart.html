<div class="cart-drawer" [class.open]="cartService.isCartOpen()">
    <div class="cart-header">
      <h3>Your Cart</h3>
      <button class="close-btn" (click)="cartService.toggleCart()">✕</button>
    </div>

    <div class="cart-body">
      @if (cartService.cart().length === 0) {
        <p class="empty-msg">Your cart is empty.</p>
      } @else {
        @for (cartItem of cartService.cart(); track cartItem.item.id) {
          <div class="cart-item">
            <img [src]="cartItem.item.imageUrl" [alt]="cartItem.item.name" />
            <div class="item-details">
              <h5>{{ cartItem.item.name }}</h5>
              <p>R{{ cartItem.item.price.toFixed(2) }}</p>
              <div class="quantity-controls">
                <button (click)="cartService.decrementQuantity(cartItem.item.id)">-</button>
                <span>{{ cartItem.quantity }}</span>
                <button (click)="cartService.incrementQuantity(cartItem.item.id)">+</button>
              </div>
            </div>
            <button class="remove-btn" (click)="cartService.removeFromCart(cartItem.item.id)">✕</button>
          </div>
        }
      }
    </div>

    <div class="cart-footer">
      <h4>Total: <span>R{{ cartService.cartTotal().toFixed(2) }}</span></h4>
      <button class="checkout-btn" [disabled]="cartService.cart().length === 0">Checkout</button>
    </div>
  </div>
