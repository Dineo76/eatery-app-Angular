<section class="menu-section">
  <div class="menu-container">
    <h2 class="menu-title">Our Menu</h2>
    <p class="menu-subtitle">Freshly prepared kotas made with premium local ingredients.</p>

    <div class="menu-grid">
      @for (item of menuItems; track item.id) {
        <mat-card class="menu-card" appearance="outlined">
          <div class="card-image-wrapper">
            <img mat-card-image [src]="item.imageUrl" [alt]="item.name" class="card-img" />
            <span class="price-badge">R{{ item.price.toFixed(2) }}</span>
          </div>

          <mat-card-header>
            <mat-card-title class="item-name">{{ item.name }}</mat-card-title>
          </mat-card-header>

          <mat-card-content class="card-content">
            <p class="item-description">{{ item.description }}</p>
          </mat-card-content>

          <mat-card-actions align="end" class="card-actions">
            <button mat-raised-button color="primary" class="add-btn" (click)="addToCart(item)">
              <mat-icon>add_shopping_cart</mat-icon> Add
            </button>
          </mat-card-actions>
        </mat-card>
      }
    </div>
  </div>
</section>
