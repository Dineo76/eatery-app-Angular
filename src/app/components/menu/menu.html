  <div class="menu-container">
    <h2>Our Menu</h2>
  
    <div class="menu-grid">
      @for (item of menuItems; track item.id) {
        <mat-card class="menu-card" appearance="outlined">
          <img mat-card-image [src]="item.imageUrl" [alt]="item.name" class="card-img" />
          
          <mat-card-header>
            <mat-card-title>{{ item.name }}</mat-card-title>
            <mat-card-subtitle>R{{ item.price.toFixed(2) }}</mat-card-subtitle>
          </mat-card-header>
  
          <mat-card-content>
            <p>{{ item.description }}</p>
          </mat-card-content>
  
          <mat-card-actions align="end">
            <button mat-raised-button color="primary" (click)="addToCart(item)">
              <mat-icon>add_shopping_cart</mat-icon> Add to Cart
            </button>
          </mat-card-actions>
        </mat-card>
      }
    </div>
  </div>
